<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Howard CISO - Mobile Experience Simulator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 12px;
      background: #090d16;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .device-wrapper {
      position: relative;
      width: 393px;
      height: 852px;
      background: #000000;
      border-radius: 54px;
      box-shadow: 
        0 0 0 12px #1e293b,
        0 0 0 14px #334155,
        0 25px 60px -15px rgba(0, 0, 0, 0.9),
        0 0 40px rgba(245, 158, 11, 0.15);
      overflow: hidden;
      border: 4px solid #0f172a;
      transition: all 0.3s ease;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #000000;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
    }

    .island-lens {
      width: 11px;
      height: 11px;
      background: #0d1527;
      border-radius: 50%;
      box-shadow: inset 0 0 2px #38bdf8;
    }

    .island-sensor {
      width: 9px;
      height: 9px;
      background: #111827;
      border-radius: 50%;
    }

    /* Status Bar */
    .status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      z-index: 40;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 28px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(to bottom, rgba(3, 7, 18, 0.9) 0%, rgba(3, 7, 18, 0.4) 70%, transparent 100%);
    }

    /* Target Webview Iframe */
    .mobile-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #030712;
      border-radius: 50px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Home Indicator bar */
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 138px;
      height: 4.5px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 10px;
      z-index: 60;
      pointer-events: none;
    }

    .ctrl-pill {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      transition: all 0.2s;
    }
    .ctrl-pill.active {
      background: #c2410c;
      border-color: #f97316;
      color: #ffffff;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <div class="w-full max-w-[440px] flex items-center justify-between mb-4 bg-slate-900/90 border border-slate-800 rounded-2xl px-4 py-2.5 shadow-xl backdrop-blur-md">
    <div class="flex items-center gap-2">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
      <span class="text-xs font-bold text-slate-200">即時手機網頁實體模擬</span>
    </div>
    
    <div class="flex items-center gap-1.5">
      <button onclick="setDevice(393, 852, this)" class="ctrl-pill active text-[11px] px-2.5 py-1 rounded-lg">iPhone</button>
      <button onclick="setDevice(360, 780, this)" class="ctrl-pill text-[11px] px-2.5 py-1 rounded-lg">Android</button>
      <button onclick="reloadFrame()" class="text-xs text-amber-400 hover:text-amber-300 p-1.5 rounded-lg bg-slate-800" title="重新載入">
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>
    </div>
  </div>

  <!-- Physical Mobile Mockup Frame -->
  <div class="device-wrapper" id="phone-container">
    
    <!-- Dynamic Island Pill -->
    <div class="dynamic-island">
      <div class="island-lens"></div>
      <div class="island-sensor"></div>
    </div>

    <!-- Mobile Status Bar -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="flex items-center gap-1.5 text-xs">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z"/></svg>
        <span>5G</span>
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><rect x="2" y="7" width="18" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 11v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="4" y="9" width="13" height="6" fill="currentColor"/></svg>
      </div>
    </div>

    <!-- Live Website Embedded in Iframe -->
    <iframe id="web-frame" src="index.html" class="mobile-frame" allowfullscreen></iframe>

    <!-- iOS Home Indicator -->
    <div class="home-bar"></div>
  </div>

  <div class="mt-4 text-center text-xs text-slate-500 max-w-[390px]">
    💡 可在手機框內直接上下滑動、點擊底部 Dock（簡介/雷達/職能/經歷/履歷）、測試抽屜選單與多語切換。
  </div>

  <script>
    function setDevice(w, h, btn) {
      const container = document.getElementById('phone-container');
      container.style.width = w + 'px';
      container.style.height = h + 'px';
      document.querySelectorAll('.ctrl-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function reloadFrame() {
      const frame = document.getElementById('web-frame');
      frame.src = frame.src;
    }
  </script>
</body>
</html>
